workflows:
  ios-development:
    name: URReefcam – Development Build
    # A healthy build finishes well inside 15 minutes. Capping at 30 keeps a
    # hung run from eating a twelfth of the monthly free-tier allowance.
    max_build_duration: 30
    instance_type: mac_mini_m1

    # Build every push on every branch. Without this the workflow only ran when
    # someone clicked "Start new build", so a branch could sit broken until it
    # was built by hand — which is how the last round of build breaks was found.
    #
    # Only `push` is listed on purpose: adding `pull_request` would build a PR
    # branch twice for the same commit and burn double the free-tier minutes.
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: '*'
          include: true
          source: true
      # Superseded commits stop building as soon as a newer one arrives.
      cancel_previous_builds: true

    environment:
      xcode: 16.2
      vars:
        XCODE_SCHEME: URReefcam
        BUNDLE_ID: com.ureefcam.app

    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen

      - name: Generate Xcode project
        script: |
          cd $CM_BUILD_DIR
          xcodegen generate

      - name: Set build number
        script: |
          BUILD_NUM=$(($(git rev-list HEAD --count)))
          PLIST=$(find . -path "*/DerivedData" -prune -o -name "Info.plist" -print | head -1)
          if [ -n "$PLIST" ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUM" "$PLIST"
          fi

      - name: Build (unsigned – for Sideloadly)
        script: |
          xcodebuild \
            -project URReefcam.xcodeproj \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package as IPA (unsigned)
        script: |
          APP_PATH=$(find DerivedData -name "*.app" | head -1)
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r URReefcam_unsigned.ipa Payload
          rm -rf Payload

    artifacts:
      - URReefcam_unsigned.ipa
      - DerivedData/Logs/**

    publishing:
      email:
        recipients:
          - geovonni.o@gmail.com
        notify:
          success: true
          failure: true
